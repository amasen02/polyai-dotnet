name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt && ! grep -q "has the following vulnerable packages" vuln-report.txt

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Pack
        run: dotnet pack src/PolyAI/PolyAI.csproj --no-restore -c Release -o ./artifacts
      - name: Compile an isolated local-package consumer
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          dotnet new console --framework net9.0 --output "$consumer_dir" --name PolyAI.PackageConsumer --no-restore
          dotnet add "$consumer_dir/PolyAI.PackageConsumer.csproj" package PolyAI.DotNet --version 1.0.0 --source "$GITHUB_WORKSPACE/artifacts" --no-restore
          cat > "$consumer_dir/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-package-under-test" value="$GITHUB_WORKSPACE/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          cat > "$consumer_dir/Program.cs" <<'EOF'
          using Microsoft.Extensions.DependencyInjection;
          using PolyAI.Extensions;

          var services = new ServiceCollection();
          services.AddPolyAI(options => options.UseOllama());
          Console.WriteLine("PolyAI local package consumer compiled.");
          EOF
          package_cache="$consumer_dir/packages"
          dotnet restore "$consumer_dir/PolyAI.PackageConsumer.csproj" --configfile "$consumer_dir/NuGet.Config" --packages "$package_cache"
          expected_hash="$(openssl dgst -sha512 -binary "$GITHUB_WORKSPACE/artifacts/PolyAI.DotNet.1.0.0.nupkg" | base64 -w0)"
          actual_hash="$(tr -d '\r\n' < "$package_cache/polyai.dotnet/1.0.0/polyai.dotnet.1.0.0.nupkg.sha512")"
          test "$actual_hash" = "$expected_hash"
          grep -F "\"source\": \"$GITHUB_WORKSPACE/artifacts\"" "$package_cache/polyai.dotnet/1.0.0/.nupkg.metadata"
          dotnet build "$consumer_dir/PolyAI.PackageConsumer.csproj" --no-restore -warnaserror
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [build-test, pack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release)')
    environment: nuget
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore
      - name: Pack
        run: dotnet pack src/PolyAI/PolyAI.csproj --no-restore -c Release -o ./artifacts
      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
